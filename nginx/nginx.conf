# CHO SẴN — cấu hình Nginx làm load balancer cho phần điểm cộng của CP4.
#
# `docker compose up --scale chat=3` tạo 3 container cùng tên service `chat`.
# Docker DNS trả về cả 3 IP cho hostname `chat`, Nginx lần lượt gửi request
# tới từng IP (round-robin). Đây là lý do app phải stateless: hai request liên
# tiếp của cùng một client có thể rơi vào hai container khác nhau.

events {
    worker_connections 1024;
}

http {
    upstream chat_backend {
        server chat:8000;
    }

    server {
        listen 80;

        # Nginx tự bỏ instance trả lỗi ra khỏi vòng xoay trong 30 giây
        proxy_next_upstream error timeout http_502 http_503;

        location /healthz {
            proxy_pass http://chat_backend/healthz;
        }

        location / {
            proxy_pass http://chat_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }
    }
}
